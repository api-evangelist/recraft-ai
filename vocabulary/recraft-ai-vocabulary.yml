vocabulary: Recraft
providerId: recraft-ai
created: '2026-05-25'
modified: '2026-05-25'
description: Operational and capability vocabulary covering the Recraft AI image generation platform. Maps the
  provider's nouns and verbs to the dimensions Naftiko uses to align capabilities across providers.
operationalDimensions:
  domain: Generative AI
  subdomain: Image and Vector Generation
  modality:
    - text-to-image
    - text-to-vector
    - image-to-image
    - image-to-vector
    - prompt-enhancement
  outputFormats:
    - PNG
    - WEBP
    - JPG
    - SVG
  inputFormats:
    - text/plain
    - image/png
    - image/webp
    - image/jpeg
    - multipart/form-data
  authentication:
    - bearer-token
    - oauth (remote MCP)
  metering:
    - api-units
    - subscription-credits
capabilityDimensions:
  generation:
    - createImage
    - createRasterImage
    - createVectorImage
    - exploreImages
  editing:
    - imageToImage
    - inpaint
    - outpaint
    - eraseRegion
    - variateImage
    - exploreSimilar
  background:
    - removeBackground
    - replaceBackground
    - generateBackground
  postProcessing:
    - vectorize
    - crispUpscale
    - creativeUpscale
  promptShaping:
    - enhancePrompt
  brand:
    - createCustomStyle
    - applyStyle
    - applySubstyle
    - applyColorPalette
    - applyBackgroundColor
    - controlNoText
    - controlArtisticLevel
  account:
    - getCurrentUser
    - inspectCreditBalance
models:
