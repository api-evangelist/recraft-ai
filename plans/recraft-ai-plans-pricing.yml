specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Recraft
providerId: recraft-ai
created: '2026-05-25'
modified: '2026-05-25'
reconciled: true
tags:
  - AI
  - Image Generation
  - Vector
  - Credits
description: 'Reconciled API plans and per-operation API-unit pricing for Recraft. Source: recraft.ai/docs/api-reference/pricing.
  USD $1.00 = 1,000 API units. Subscription credits and API units are separate balances; subscription credits
  are spent in Recraft Studio (and via the remote MCP server), API units are spent against the external HTTP API
  and local MCP server.'
sources:
  - https://www.recraft.ai/pricing
  - https://www.recraft.ai/docs/plans-and-billing/paid-plans
  - https://www.recraft.ai/docs/plans-and-billing/free-plan
  - https://www.recraft.ai/docs/plans-and-billing/credits
  - https://www.recraft.ai/docs/api-reference/pricing
plans:
  - id: recraft-free
    name: Free
    type: subscription
    description: Free Recraft Studio plan. Generated images are owned by Recraft and publicly visible.
    entries:
      - label: User
        name: user
        type: included
        limit: 1
        unit: 1
        price: '0.00'
        timeFrame: month
        geo: global
    elements:
      - Recraft Studio access
      - Public, non-commercial generations
      - Daily credit allowance
  - id: recraft-paid-subscription
    name: Paid (Recraft Studio)
    type: subscription
    description: Paid Recraft Studio subscription tiers with private projects, commercial rights, custom styles, and
      subscription credits. Multiple billing tiers exist (Basic, Advanced, Pro, Business, Teams) with monthly and
      annual options (annual saves 20%). Subscription credits do not roll over month to month; top-ups available.
    entries:
      - label: Monthly subscription credits
        name: subscription_credits
        type: included
        metric: credit
        unit: 1
        timeFrame: month
        geo: global
    elements:
      - Private projects
      - Full commercial ownership
      - Custom style creation in Studio
      - Recraft V4.1 / V4 / V3 / V2 access
      - External model usage (Flux, Ideogram, GPT Image, Imagen, etc.)
      - Mockup generator and color palettes
      - Top-up credit purchases
  - id: recraft-api
    name: API Units
    type: usage-based
    description: Pay-as-you-go API units used against the external HTTP API and the local MCP server. USD $1.00 buys
      1,000 API units. Charges are per operation, vary by model and output type, and are deducted on successful
      response. Billed separately from Recraft Studio subscription credits.
    entries:
      - label: API unit
        name: api_unit
        type: metered
        metric: api_unit
        unit: 1000
        timeFrame: usage
        price: '1.00'
        geo: global
  - id: recraft-enterprise
    name: Enterprise
    type: contract
    description: Custom enterprise contracts for teams operating Recraft at scale. Trusted customers include Asana,
      HubSpot, Ogilvy, Airbus, Netflix, and Microsoft. Pricing on application.
    entries:
      - label: Negotiated
        name: enterprise
        type: contract
        price: 'Call'
        timeFrame: month
        geo: global
