naftiko: 1.0.0-alpha2
info:
  label: Recraft Images API — Generation
  description: 'Recraft Images API — text-to-image generation across raster, vector, and explore surfaces. 4 operations.
    Lead operation: Recraft Create Image From Prompt. Self-contained Naftiko capability covering Recraft''s core generation
    business surface.'
  tags:
  - Recraft
  - Images
  - Generation
  - Vector
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    RECRAFT_API_TOKEN: RECRAFT_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: images-generation
    baseUri: https://external.api.recraft.ai
    description: Recraft Images API — Generation business capability. Self-contained, no shared references.
    resources:
    - name: v1-images-generations
      path: /v1/images/generations
      operations:
      - name: createimage
        method: POST
        description: Recraft Create Image From Prompt
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-images-generations-raster
      path: /v1/images/generations/raster
      operations:
      - name: createraster
        method: POST
        description: Recraft Create Raster Image
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: v1-images-generations-vector
      path: /v1/images/generations/vector
      operations:
      - name: createvector
        method: POST
        description: Recraft Create Vector Image
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: v1-images-explore
      path: /v1/images/explore
      operations:
      - name: exploreimages
        method: POST
        description: Recraft Explore Diverse Variations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: 'Bearer {{env.RECRAFT_API_TOKEN}}'
      placement: header
  exposes:
  - type: rest
    namespace: images-generation-rest
    port: 8080
    description: REST adapter for Recraft Images API — Generation. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/images/generations
      name: v1-images-generations
      description: REST surface for v1-images-generations.
      operations:
      - method: POST
        name: createimage
        description: Recraft Create Image From Prompt
        call: images-generation.createimage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/images/generations/raster
      name: v1-images-generations-raster
      description: REST surface for raster generation.
      operations:
      - method: POST
        name: createraster
        description: Recraft Create Raster Image
        call: images-generation.createraster
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/images/generations/vector
      name: v1-images-generations-vector
      description: REST surface for vector generation.
      operations:
      - method: POST
        name: createvector
        description: Recraft Create Vector Image
        call: images-generation.createvector
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/images/explore
      name: v1-images-explore
      description: REST surface for explore.
      operations:
      - method: POST
        name: exploreimages
        description: Recraft Explore Diverse Variations
        call: images-generation.exploreimages
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: images-generation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Recraft Images API — Generation. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: recraft-create-image
      description: Recraft Create Image From Prompt
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: images-generation.createimage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: recraft-create-raster
      description: Recraft Create Raster Image
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: images-generation.createraster
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: recraft-create-vector
      description: Recraft Create Vector Image
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: images-generation.createvector
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: recraft-explore-images
      description: Recraft Explore Diverse Variations
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: images-generation.exploreimages
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
