description: >-
  Recraft is a London-based AI design platform — founded in 2023 by Anna Veronika Dorogush (creator of the CatBoost ML
  framework) — that builds production-grade image and vector generation models tailored for professional designers and
  brands. Its Recraft V4.1, V4, V3, and V2 models generate photorealistic raster images, true SVG vector graphics,
  logos, icons, and seamless patterns with strong control over style, custom brand styles, color palettes, and text
  placement. The Recraft API exposes prompt-to-image, vector generation, image-to-image, inpainting, outpainting,
  vectorization, background tooling, upscaling, custom style creation, prompt enhancement, and account inspection over
  HTTPS with Bearer token authentication and an OpenAI-compatible request shape, complemented by hosted and self-hosted
  Model Context Protocol servers for use from Claude and other agentic AI clients.
